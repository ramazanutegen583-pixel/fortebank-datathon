services:
  review:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_RUNTIME_DIR: /app/runtime
      APP_TEST_MODE: "0"
    volumes:
      - review_runtime:/app/runtime
      - ../models:/app/models:ro
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  review_runtime:
